<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Poké Coleção</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f5f7fb;color:#111827}.wrap{max-width:1050px;margin:auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center}.muted{color:#6b7280}.pill{background:#eef2ff;padding:7px 11px;border-radius:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.box,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:13px}.big{font-size:23px;font-weight:800}
input,select{padding:11px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;background:white;width:100%;box-sizing:border-box}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.set{background:white;border:1px solid #ddd;border-radius:12px;padding:10px;text-align:left}.set img{width:100%;height:50px;object-fit:contain}.set b{display:block;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;margin-top:10px}.card{background:#fff;border:1px solid #ddd;border-radius:13px;overflow:hidden}.card img{width:100%;aspect-ratio:.716;object-fit:cover}.body{padding:8px}.actions{display:flex;gap:5px;margin-top:6px}.actions button{flex:1;padding:7px;border:1px solid #ccc;border-radius:8px;background:white}.have{background:#dcfce7!important}.qty{margin-top:5px}.notice{padding:10px;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;color:#9a3412;margin:10px 0}
@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.sets{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<header><div><div class="muted">Organizador Pokémon TCG</div><h1>Poké Coleção ⚡</h1></div><div class="pill">Mika</div></header>
<div id="notice" class="notice">Carregando todas as coleções…</div>
<div class="stats"><div class="box"><div class="muted">Tenho</div><div id="owned" class="big">0</div></div><div class="box"><div class="muted">Coleções</div><div id="setsN" class="big">—</div></div><div class="box"><div class="muted">Cartas</div><div id="cardsN" class="big">—</div></div><div class="box"><div class="muted">Progresso</div><div id="pct" class="big">0%</div></div></div>
<section class="panel"><h2>📚 Todas as coleções</h2><div class="filters"><input id="q" placeholder="🔎 Buscar coleção"><select id="sf"><option value="all">Todas as séries</option></select></div><div id="sets" class="sets"></div></section>
<section id="panel" class="panel" style="margin-top:12px;display:none"><h2 id="title"></h2><div id="meta" class="muted"></div><div class="filters"><input id="cq" placeholder="🔎 Buscar carta"><select id="cf"><option value="all">Todas</option><option value="owned">Tenho</option><option value="missing">Faltam</option><option value="fav">⭐ Favoritas</option></select></div><div id="cards" class="cards"></div></section>
<p class="muted" style="font-size:12px">Catálogo e imagens via TCGdex. O aplicativo não é oficial da Pokémon.</p></div>
<script>
const A='https://api.tcgdex.net/v2/en',K='pokeColecaoV5';let sets=[],cache={},active=null,db=JSON.parse(localStorage.getItem(K)||'{}');
const $=x=>document.querySelector(x),N=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function d(id){return db[id]||(db[id]={have:false,qty:0,fav:false})}function save(){localStorage.setItem(K,JSON.stringify(db))}
async function get(u){let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
async function init(){try{sets=await get(A+'/sets');let sr=await get(A+'/series'),m={};sr.forEach(s=>(s.sets||[]).forEach(x=>m[x.id]=s.name));sets.forEach(s=>s.seriesName=m[s.id]||'Outras');let names=[...new Set(sets.map(s=>s.seriesName))].sort();$('#sf').innerHTML='<option value="all">Todas as séries</option>'+names.map(x=>'<option>'+x+'</option>').join('');$('#notice').style.display='none';$('#setsN').textContent=sets.length;$('#cardsN').textContent=sets.reduce((n,s)=>n+(s.cardCount?.total||0),0).toLocaleString('pt-BR');renderSets();stats()}catch(e){$('#notice').textContent='Não consegui carregar o catálogo. Recarregue com internet ativa.'}}
function renderSets(){let q=N($('#q').value),sf=$('#sf').value;let a=sets.filter(s=>(sf==='all'||s.seriesName===sf)&&(!q||N(s.name).includes(q)));$('#sets').innerHTML=a.map(s=>'<button class="set" data-id="'+s.id+'">'+(s.logo?'<img src="'+s.logo+'.webp">':'')+'<b>'+s.name+'</b><small>'+s.seriesName+' • '+(s.cardCount?.total||0)+' cartas</small></button>').join('');document.querySelectorAll('.set').forEach(b=>b.onclick=()=>openSet(b.dataset.id))}
async function openSet(id){active=sets.find(s=>s.id===id);$('#panel').style.display='block';$('#title').textContent=active.name;$('#meta').textContent=active.seriesName+' • '+active.cardCount.total+' cartas';$('#cards').innerHTML='<p class="muted">Carregando cartas…</p>';if(!cache[id])cache[id]=(await get(A+'/sets/'+id)).cards||[];renderCards();$('#panel').scrollIntoView({behavior:'smooth'})}
function stats(){let o=Object.values(db).filter(x=>x.have||x.qty>0).length,total=sets.reduce((n,s)=>n+(s.cardCount?.total||0),0);$('#owned').textContent=o;$('#pct').textContent=total?(o/total*100).toFixed(1)+'%':'0%'}
function renderCards(){let a=cache[active.id]||[],q=N($('#cq').value),f=$('#cf').value;a.forEach(c=>{if(!c._f)get(A+'/cards/'+c.id).then(x=>{Object.assign(c,x);c._f=1;renderCards()}).catch(()=>{})});a=a.filter(c=>{let x=d(c.id),h=N((c.name||'')+' '+(c.localId||''));return(!q||h.includes(q))&&(f==='all'||f==='owned'&&x.have||f==='missing'&&!x.have||f==='fav'&&x.fav)});$('#cards').innerHTML=a.map(c=>{let x=d(c.id),img=c.image?c.image.replace(/\/$/,'')+'/high.webp':'';return '<article class="card">'+(img?'<img src="'+img+'" loading="lazy">':'')+'<div class="body"><small>#'+(c.localId||'')+'</small><b>'+ (c.name||'Carregando…')+'</b><div class="actions"><button class="'+(x.have?'have':'')+'" data-h="'+c.id+'">'+(x.have?'✅ Tenho':'＋ Tenho')+'</button><button data-f="'+c.id+'">'+(x.fav?'⭐':'☆')+'</button></div><input class="qty" data-q="'+c.id+'" type="number" min="0" value="'+(x.qty||0)+'" placeholder="Quantidade"></div></article>'}).join('');document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{let x=d(b.dataset.h);x.have=!x.have;if(x.have&&!x.qty)x.qty=1;save();renderCards();stats()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{d(b.dataset.f).fav=!d(b.dataset.f).fav;save();renderCards()});document.querySelectorAll('[data-q]').forEach(i=>i.oninput=()=>{let x=d(i.dataset.q);x.qty=+i.value||0;x.have=x.qty>0;save();renderCards();stats()})}
$('#q').oninput=renderSets;$('#sf').onchange=renderSets;$('#cq').oninput=renderCards;$('#cf').onchange=renderCards;init();
</script></body></html>
